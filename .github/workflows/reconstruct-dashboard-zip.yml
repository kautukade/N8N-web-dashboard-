name: Reconstruct dashboard ZIP

on:
  workflow_dispatch:
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    paths:
      - ".github/upload-parts/**"
      - ".github/workflows/reconstruct-dashboard-zip.yml"

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Commit archive part diagnostics
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Archive part sizes"
            wc -c .github/upload-parts/part-*.b64
            echo
            echo "Archive part SHA-256"
            sha256sum .github/upload-parts/part-*.b64
          } > archive-part-diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive-part-diagnostics.txt
          if ! git diff --cached --quiet; then
            git commit -m "Add archive part diagnostics"
            git push origin HEAD:main
          fi

      - name: Reconstruct and validate ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/upload-parts/part-11.b64
          cat .github/upload-parts/part-*.b64 | base64 --decode > business-dashboard-production-ready.zip
          unzip -t business-dashboard-production-ready.zip
          sha256sum business-dashboard-production-ready.zip > business-dashboard-production-ready.zip.sha256

      - name: Commit ZIP archive
        shell: bash
        run: |
          set -euo pipefail
          git add business-dashboard-production-ready.zip business-dashboard-production-ready.zip.sha256
          git diff --cached --quiet && exit 0
          git commit -m "Add production dashboard ZIP"
          git push origin HEAD:main
